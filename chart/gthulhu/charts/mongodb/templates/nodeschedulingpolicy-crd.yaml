{{- $existingCrd := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "nodeschedulingpolicies.gthulhu.io" }}
{{- if not $existingCrd }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodeschedulingpolicies.gthulhu.io
  annotations:
    helm.sh/resource-policy: keep
spec:
  group: gthulhu.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                nodeSelectors:
                  type: array
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                      value:
                        type: string
                nodeNames:
                  type: array
                  items:
                    type: string
                draSelectors:
                  type: array
                  items:
                    type: object
                    properties:
                      deviceClass:
                        type: string
                      attributes:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            value:
                              type: string
                commandRegex:
                  type: string
                priority:
                  type: integer
                executionTime:
                  type: integer
                  format: int64
                creatorID:
                  type: string
                updaterID:
                  type: string
                createdTime:
                  type: integer
                  format: int64
                updatedTime:
                  type: integer
                  format: int64
      additionalPrinterColumns:
        - name: Priority
          type: integer
          jsonPath: .spec.priority
        - name: CommandRegex
          type: string
          jsonPath: .spec.commandRegex
        - name: Creator
          type: string
          jsonPath: .spec.creatorID
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: nodeschedulingpolicies
    singular: nodeschedulingpolicy
    kind: NodeSchedulingPolicy
    shortNames:
      - nsp
{{- end }}
